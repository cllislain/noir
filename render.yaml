services:
  # ── Backend — Django/Gunicorn Web Service ─────────────────────────────────
  - type: web
    name: noir-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_ALLOWED_HOSTS
        value: noir-backend.onrender.com  # update with your actual service name
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # e.g. https://noir-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # e.g. https://noir-frontend.onrender.com,https://noir-backend.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: AUTH_THROTTLE_RATE
        value: 10/hour
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: SECURE_SSL_REDIRECT
        value: "True"
    healthCheckPath: /api/v1/

  # ── Frontend — React/Vite Static Site ─────────────────────────────────────
  - type: web
    name: noir-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve dist -s -l $PORT
    envVars:
      - key: VITE_API_URL
        sync: false  # set to https://noir-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
